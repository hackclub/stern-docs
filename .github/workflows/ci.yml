name: CI

# Every docs pull request gets built. A typo in frontmatter, a `group` that
# doesn't exist, or markdown that breaks the render should fail here rather than
# on the live site — contributors editing a file on github.com can't run the
# build themselves.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 of these actions runs on the runner's Node 24; v4 runs on Node 20,
      # which GitHub has deprecated.
      - uses: actions/checkout@v5

      # No `version:` input on purpose. package.json's `packageManager` field
      # (pnpm@10.26.1) is the single source of truth, and specifying both makes
      # the action fail outright with ERR_PNPM_BAD_PM_VERSION rather than
      # picking one — so the version lives where corepack and local installs
      # already read it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Frontmatter shape, credits on copied text, and the spelling of
      # "Hack Club". The cheap checks a github.com editor can't run.
      - run: pnpm check:content

      - run: pnpm exec tsc --noEmit

      # Palette extraction reaches out to the CDN and the program API; neither is
      # required to build (both degrade to defaults), so a flaky network can't
      # fail somebody's typo fix.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
